[package]
name = "starbooru-web"
description = "StarBooru for the browser: Rust and Leptos, compiled to WebAssembly"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/StarBooru/starbooru-web"
publish = false

[dependencies]
starbooru-core = { git = "https://github.com/StarBooru/starbooru-server", tag = "v0.1.0-beta.6" }
starbooru-client = { git = "https://github.com/StarBooru/starbooru-server", tag = "v0.1.0-beta.6" }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock", "wasmbind"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Document",
  "DomTokenList",
  "Element",
  "HtmlElement",
  "Location",
  "MediaQueryList",
  "Navigator",
  "Storage",
  "Window",
] }

[dev-dependencies]
fluent-syntax = "0.12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package]
name = "starbooru-web"
description = "StarBooru for the browser: Rust and Leptos, compiled to WebAssembly"
version = "0.29.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/StarBooru/starbooru-web"
publish = false

[dependencies]
starbooru-core = { git = "https://github.com/StarBooru/starbooru-server", tag = "v0.6.0" }
starbooru-client = { git = "https://github.com/StarBooru/starbooru-server", tag = "v0.6.0" }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock", "wasmbind"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
wasm-bindgen = "0.2"
# The chunks of an upload, as the client reads them.
bytes = "1"
# Stops an upload on its way.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Lets a browser handle go into Leptos's cleanups, which want `Send`.
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "Blob",
  "CanvasRenderingContext2d",
  "Clipboard",
  "ClipboardEvent",
  "ClipboardItem",
  "CssStyleDeclaration",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "DomRect",
  "DomTokenList",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FilePropertyBag",
  "FileSystemDirectoryEntry",
  "FileSystemDirectoryReader",
  "FileSystemEntry",
  "FileSystemFileEntry",
  "History",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlMediaElement",
  "HtmlTextAreaElement",
  "HtmlVideoElement",
  "ImageBitmap",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "MediaError",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "NodeList",
  "Performance",
  "PointerEvent",
  "ResizeObserver",
  "Response",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollRestoration",
  "ScrollToOptions",
  "ServiceWorkerContainer",
  "Storage",
  "StorageEvent",
  "TimeRanges",
  "Url",
  "WheelEvent",
  "Window",
] }

[dev-dependencies]
fluent-syntax = "0.12"
# The client's own HTTP crate, to make the network errors it reports.
reqwest = { version = "0.13", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"

# With full debug info the wasm grew past what rust-lld can write, and the
# debug build crashed while linking. Panic messages keep their file and line.
[profile.dev]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

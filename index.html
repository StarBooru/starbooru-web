<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>StarBooru</title>
    <link data-trunk rel="icon" href="assets/brand/favicon.svg">
    <link data-trunk rel="copy-file" href="assets/brand/favicon-32.png">
    <link data-trunk rel="copy-file" href="assets/brand/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- The browser's own bars take the canvas colour. The app keeps these in
         step with the theme and the accent (app.rs). -->
    <meta id="theme-color-light" name="theme-color" content="#f9fafe" media="(prefers-color-scheme: light)">
    <meta id="theme-color-dark" name="theme-color" content="#0e0e13" media="(prefers-color-scheme: dark)">
    <style>
      /* The loading screen, over the page until the app is on it (base.css takes
         it away). It is styled here so that it paints before anything has
         loaded. The colours are the --canvas, --primary-container and --primary
         of style/tokens.css: a test in app.rs keeps the two the same. */
      html, body { margin: 0; }
      #boot {
        --h: 285;
        --canvas: oklch(0.985 0.006 var(--h));
        --primary-container: oklch(0.9 0.06 var(--h));
        --primary: oklch(0.5 0.17 var(--h));
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: var(--canvas);
      }
      #boot[data-theme="dark"] {
        --canvas: oklch(0.165 0.012 var(--h));
        --primary-container: oklch(0.37 0.1 var(--h));
        --primary: oklch(0.8 0.11 var(--h));
      }
      @media (prefers-color-scheme: dark) {
        #boot:not([data-theme="light"]) {
          --canvas: oklch(0.165 0.012 var(--h));
          --primary-container: oklch(0.37 0.1 var(--h));
          --primary: oklch(0.8 0.11 var(--h));
        }
      }
      /* The ring waits a moment. A start that takes less shows the plain
         colour and then the app, without a ring flashing in between. */
      #boot::after {
        content: ""; width: 32px; height: 32px; border-radius: 50%;
        border: 4px solid var(--primary-container); border-top-color: var(--primary);
        opacity: 0; animation: boot-spin 0.8s linear infinite, boot-show 0.2s 0.4s forwards;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot::after { animation: boot-show 0.2s 0.4s forwards; }
      }
    </style>
    <!-- Tokens first: the rest are written in them. Pages add style/pages/<page>.css after these. -->
    <link data-trunk rel="css" href="style/tokens.css">
    <link data-trunk rel="css" href="style/base.css">
    <link data-trunk rel="css" href="style/shell.css">
    <link data-trunk rel="css" href="style/pages/login.css">
    <link data-trunk rel="css" href="style/pages/gallery.css">
    <link data-trunk rel="css" href="style/pages/post.css">
    <link data-trunk rel="css" href="style/pages/editor.css">
    <link data-trunk rel="css" href="style/pages/explore.css">
    <link data-trunk rel="css" href="style/pages/help.css">
    <link data-trunk rel="css" href="style/pages/tags.css">
    <link data-trunk rel="css" href="style/pages/upload.css">
    <link data-trunk rel="css" href="style/pages/trash.css">
    <link data-trunk rel="css" href="style/pages/duplicates.css">
    <link data-trunk rel="css" href="style/pages/boorus.css">
    <link data-trunk rel="css" href="style/pages/settings.css">
    <!-- wasm-opt has to be told the features Rust's wasm32 target uses by default. -->
    <link data-trunk rel="rust" data-bin="starbooru-web" data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue">
  </head>
  <body>
    <div id="main"></div>
    <div id="boot" aria-hidden="true"></div>
    <script>
      // The theme and the colour picked in Settings, as the app keeps them.
      try {
        const prefs = JSON.parse(localStorage.getItem("starbooru") ?? "{}").prefs ?? {};
        const boot = document.getElementById("boot");
        if (prefs.theme === "dark" || prefs.theme === "light") boot.dataset.theme = prefs.theme;
        if (Number.isFinite(prefs.accent_hue)) boot.style.setProperty("--h", prefs.accent_hue);
      } catch {}
    </script>
  </body>
</html>

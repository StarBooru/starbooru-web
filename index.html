<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>StarBooru</title>
    <!-- Installing (install.rs): the manifest and its icons, and the service
         worker, which has to sit at the root to look after every page. -->
    <link data-trunk rel="copy-file" href="assets/brand/favicon.svg">
    <link data-trunk rel="copy-file" href="assets/brand/favicon-32.png">
    <link data-trunk rel="copy-file" href="assets/brand/apple-touch-icon.png">
    <link data-trunk rel="copy-file" href="assets/brand/icon-192.png">
    <link data-trunk rel="copy-file" href="assets/brand/icon-512.png">
    <link data-trunk rel="copy-file" href="assets/brand/icon-maskable-512.png">
    <link data-trunk rel="copy-file" href="assets/manifest.webmanifest">
    <link data-trunk rel="copy-file" href="assets/sw.js">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="StarBooru">
    <!-- An opaque bar in the system's light or dark: a see-through one keeps
         white text, which the light theme can't carry. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- The browser's own bars take the canvas colour. The app keeps these in
         step with the theme and the accent (app.rs). -->
    <meta id="theme-color-light" name="theme-color" content="#f9fafe" media="(prefers-color-scheme: light)">
    <meta id="theme-color-dark" name="theme-color" content="#0e0e13" media="(prefers-color-scheme: dark)">
    <style>
      /* The loading screen, over the page until the app is on it (base.css takes
         it away). It is styled here so that it paints before anything has
         loaded. The colours are the --canvas, --primary-container and --primary
         of style/tokens.css: a test in app.rs keeps the two the same. */
      html, body { margin: 0; }
      #boot {
        --h: 285;
        --c: 1;
        --l: 0.5;
        --k: min(1, var(--c) / 0.16);
        --pull: calc(1 - var(--k));
        --canvas: oklch(0.985 calc(0.006 * var(--k)) var(--h));
        --primary-container: oklch(0.9 min(0.06, var(--c)) var(--h));
        --primary: oklch(calc(0.5 + var(--pull) * (0.2 + 0.3 * var(--l) - 0.5)) min(0.17, var(--c)) var(--h));
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: var(--canvas);
      }
      #boot[data-theme="dark"] {
        --canvas: oklch(0.165 calc(0.012 * var(--k)) var(--h));
        --primary-container: oklch(0.37 min(0.1, var(--c)) var(--h));
        --primary: oklch(calc(0.8 + var(--pull) * (0.68 + 0.28 * var(--l) - 0.8)) min(0.11, var(--c)) var(--h));
      }
      @media (prefers-color-scheme: dark) {
        #boot:not([data-theme="light"]) {
          --canvas: oklch(0.165 calc(0.012 * var(--k)) var(--h));
          --primary-container: oklch(0.37 min(0.1, var(--c)) var(--h));
          --primary: oklch(calc(0.8 + var(--pull) * (0.68 + 0.28 * var(--l) - 0.8)) min(0.11, var(--c)) var(--h));
        }
      }
      /* The OLED mode's black. */
      #boot[data-theme="dark"][data-oled] { --canvas: oklch(0 0 0); }
      @media (prefers-color-scheme: dark) {
        #boot[data-oled]:not([data-theme="light"]) { --canvas: oklch(0 0 0); }
      }
      /* The ring waits a moment. A start that takes less shows the plain
         colour and then the app, without a ring flashing in between. */
      #boot::after {
        content: ""; width: 32px; height: 32px; border-radius: 50%;
        border: 4px solid var(--primary-container); border-top-color: var(--primary);
        opacity: 0; animation: boot-spin 0.8s linear infinite, boot-show 0.2s 0.4s forwards;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot::after { animation: boot-show 0.2s 0.4s forwards; }
      }
    </style>
    <!-- Tokens first: the rest are written in them. Pages add style/pages/<page>.css after these. -->
    <link data-trunk rel="css" href="style/tokens.css">
    <link data-trunk rel="css" href="style/base.css">
    <link data-trunk rel="css" href="style/shell.css">
    <link data-trunk rel="css" href="style/player.css">
    <link data-trunk rel="css" href="style/pages/login.css">
    <link data-trunk rel="css" href="style/pages/gallery.css">
    <link data-trunk rel="css" href="style/pages/post.css">
    <link data-trunk rel="css" href="style/pages/editor.css">
    <link data-trunk rel="css" href="style/pages/explore.css">
    <link data-trunk rel="css" href="style/pages/help.css">
    <link data-trunk rel="css" href="style/pages/tags.css">
    <link data-trunk rel="css" href="style/pages/upload.css">
    <link data-trunk rel="css" href="style/pages/trash.css">
    <link data-trunk rel="css" href="style/pages/duplicates.css">
    <link data-trunk rel="css" href="style/pages/boorus.css">
    <link data-trunk rel="css" href="style/pages/saved.css">
    <link data-trunk rel="css" href="style/pages/settings.css">
    <link data-trunk rel="css" href="style/pages/share.css">
    <link data-trunk rel="css" href="style/pages/admin.css">
    <link data-trunk rel="css" href="style/pages/legal.css">
    <!-- wasm-opt has to be told the features Rust's wasm32 target uses by default. -->
    <link data-trunk rel="rust" data-bin="starbooru-web" data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue">
  </head>
  <body>
    <div id="main"></div>
    <div id="boot" aria-hidden="true"></div>
    <script>
      // The theme and the colour picked in Settings, as the app keeps them.
      try {
        const prefs = JSON.parse(localStorage.getItem("starbooru") ?? "{}").prefs ?? {};
        const boot = document.getElementById("boot");
        if (prefs.theme === "dark" || prefs.theme === "light") boot.dataset.theme = prefs.theme;
        if (Number.isFinite(prefs.accent_hue)) boot.style.setProperty("--h", prefs.accent_hue);
        // A picked colour's chroma and lightness in OKLCH, as theme.rs reads
        // them; under 0.02 it's a grey.
        const rgb = prefs.accent_color;
        if (Array.isArray(rgb) && rgb.length === 3 && rgb.every((v) => Number.isInteger(v) && v >= 0 && v <= 255)) {
          const [r, g, b] = rgb.map((v) => v / 255).map((v) => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
          const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
          const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
          const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
          const c = Math.hypot(1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s);
          boot.style.setProperty("--c", c < 0.02 ? 0 : c.toFixed(3));
          boot.style.setProperty("--l", (0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s).toFixed(3));
        }
        // OLED: black while dark, the browser's bars too.
        if (prefs.oled === true) {
          boot.dataset.oled = "on";
          const bars = prefs.theme === "dark" ? ["light", "dark"] : prefs.theme === "light" ? [] : ["dark"];
          for (const bar of bars) document.getElementById(`theme-color-${bar}`)?.setAttribute("content", "#000000");
        }
      } catch {}
      // Chromium's offer to install can come before the app has started:
      // it's kept for install.rs, which shows it as a button in Settings.
      addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        window.starbooruInstall = event;
      });
    </script>
  </body>
</html>
